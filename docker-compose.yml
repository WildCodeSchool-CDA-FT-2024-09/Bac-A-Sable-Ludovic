services:
  newapi:
    image: postgres
    env_file: .env
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $POSTGRES_DB -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    ports:
      - 8080:8080
    container_name: adminer
    depends_on:
      newapi:
        condition: service_healthy

  api:
    build: ./api
    ports:
      - 4000:4000
    command: npm run full
    restart: always
    env_file: .env
    volumes:
      - ./api:/app
    depends_on:
      newapi:
        condition: service_healthy

  client:
    build: ./client
    command: npm run dev
    restart: always
    ports:
      - 5173:5173
    environment:
      - VITE_API_URL=http://localhost:5001/graph
    volumes:
      - ./client:/app/
      - /app/node_modules

  gateway:
    image: nginx
    ports:
      - 5001:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
      - client
