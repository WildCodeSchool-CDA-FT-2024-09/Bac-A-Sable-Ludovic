services:
  newapi:
    image: postgres
    env_file: .env
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    ports:
      - 8080:8080
    container_name: adminer
    restart: always
    depends_on:
      newapi:
        condition: service_healthy

  api:
    build: ./api
    command: npm run full
    restart: always
    env_file: .env
    volumes:
      - ./api:/app/
    depends_on:
      newapi:
        condition: service_healthy

  client:
    dns:
      - "1.1.1.1"
      - "8.8.8.8"
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - VITE_GRAPHQL_API_URL=http://localhost:5001/graph
    command: ["npm", "run", "dev"]

  gateway:
    image: nginx
    ports:
      - 5001:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
      - client
